  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PFZ4T344"

  <iframe 
      id="bepFrame" 
        name="bepTargetFrame" 
        class="app-frame"
      title="Online BEP Robotu"
      allowfullscreen>
  </iframe>

  <script>
        // SİZİN GOOGLE SCRIPT URL'NİZİ BURAYA YAPIŞTIRIN
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHGE5p3sVJ_QKSFupTpuWEjMDtcTJXClwUEqII3xWY8eXxivhilMxEZoPWjojgY5Ak/exec"; // <-- GÜNCELLEYİN

        window.onload = function() {
            var iframe = document.getElementById('bepFrame');
            var hash = window.location.hash;

            // 1. URL'de veri var mı? (#load=...)
            if (hash && hash.includes("#load=")) {
                console.log("📦 Veri algılandı, POST işlemi başlatılıyor...");
                
                // Veriyi temizle
                var data = hash.substring(6); 

                // Görünmez Form Oluştur
                var form = document.createElement("form");
                form.setAttribute("method", "POST");
                form.setAttribute("action", GOOGLE_SCRIPT_URL);
                form.setAttribute("target", "bepTargetFrame"); // Formu Iframe'in içine gönder

                // Veriyi forma ekle
                var hiddenField = document.createElement("input");
                hiddenField.setAttribute("type", "hidden");
                hiddenField.setAttribute("name", "projectData");
                hiddenField.setAttribute("value", data);
                form.appendChild(hiddenField);

                // Formu gönder
                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);

                // URL'yi temizle
                history.replaceState(null, null, ' ');

            } else {
                // 2. Veri yoksa normal aç
                console.log("ℹ️ Normal açılış yapılıyor...");
                iframe.src = GOOGLE_SCRIPT_URL;
            }
        };
    </script>
